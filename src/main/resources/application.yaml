spring:
  application:
    name: merchant-service
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:payflow}
    representation:
      uuid: standard
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger stays public on purpose: the PJBL delivery requires it in the cloud.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    persist-authorization: true

# payflow.internal-key comes from PAYFLOW_INTERNAL_KEY (required, 32+ characters).
payflow:
  demo-merchant:
    enabled: false
